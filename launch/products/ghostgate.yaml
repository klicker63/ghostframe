tagline: One exact agent version. One tested configuration. One reviewable release record.
public_url: https://www.ghostframestudios.com/ghostgate/release-check/
product_category: AI agent release assessment
problem: Teams can give AI agents consequential tools and permissions without a version-bound record of what was tested, what was allowed, and who approved release.
target_users:
  - AI product founders preparing an agent for production
  - Engineering teams integrating tool-using agents
  - Security teams reviewing agent authority and evidence
buyer_roles:
  - Founder or CTO
  - Head of AI or engineering
  - Product security lead
  - Enterprise security or procurement reviewer
core_promise: Test one exact AI agent version against its intended tools, permissions, policies, and agreed hostile scenarios, then deliver a human-reviewed release decision and version-bound evidence package.
